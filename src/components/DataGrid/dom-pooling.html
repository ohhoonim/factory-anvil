<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
   <div id="grid-wrapper" class="grid-wrapper">
    <div id="grid-header" class="grid-header">
     <div id="grid-header-content" class="grid-header-content"></div>
    </div>
    <div id="grid-container" class="grid-viewport">
     <div id="grid-phantom" class="grid-phantom"></div>
     <div id="grid-content" class="grid-content"></div>
    </div>
   </div>

<style>
.grid-wrapper {
    width: 100%;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

.grid-header {
    height: 40px;
    overflow: hidden;
    position: relative;
    background-color: #f1f1f1;
    border-bottom: 2px solid #ccc;
    font-weight: bold;
}

.grid-header-content {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    will-change: transform;
}

.grid-header-cell {
    position: absolute;
    top: 0;
    height: 100%;
    box-sizing: border-box;
    border-right: 1px solid #ccc;
    padding: 0 8px;
    display: flex;
    align-items: center;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
    background-color: #f1f1f1;
    user-select: none;
}

/* 정렬 가능한 헤더 셀 스타일 */
.grid-header-cell.sortable {
    cursor: pointer;
}
.grid-header-cell.sortable:hover {
    background-color: #e2e2e2;
}

.grid-viewport {
    height: 400px;
    overflow: auto;
    position: relative;
    will-change: transform;
    --row-height: 40px;
    background: repeating-linear-gradient(
        to bottom,
        #ffffff 0px,
        #ffffff var(--row-height),
        #f9f9f9 var(--row-height),
        #f9f9f9 calc(var(--row-height) * 2)
    );
}

.grid-phantom {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    pointer-events: none;
}

.grid-content {
    position: absolute;
    left: 0;
    top: 0;
    will-change: transform;
}

.grid-row {
    position: absolute;
    left: 0;
    top: 0;
    height: 40px;
    box-sizing: border-box;
    display: flex;
    white-space: nowrap;
}

.grid-cell {
    position: absolute;
    top: 0;
    height: 100%;
    box-sizing: border-box;
    border-right: 1px solid #eee;
    padding: 0 8px;
    display: flex;
    align-items: center;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
    background-repeat: no-repeat;
    background-position: 4px center;
    background-size: 14px 14px;
}

.grid-cell.editable {
    cursor: pointer;
}

.grid-cell.editing {
    padding: 0;
    background-image: none !important;
}

.grid-cell-input {
    width: 100%;
    height: 100%;
    border: 2px solid #4A90E2;
    padding: 0 6px;
    box-sizing: border-box;
    font-size: 13px;
    outline: none;
    background: #fff;
}

.grid-cell.has-icon {
    padding-left: 22px;
}
.type-string { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%234A90E2"><path d="M13 6h-2v8h2V6zm4 0h-2v8h2V6zM7 6h2v8H7V6z"/></svg>'); }
.type-number { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2350E3C2"><path d="M7 11h2v2H7zM11 11h2v2h-2zM15 11h2v2h-2z"/></svg>'); }
.type-objectId { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23F5A623"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>'); }
</style>

<script>
class HighPerformanceGrid {
    constructor(containerId, rawData, columns, options = {}) {
        this.container = document.getElementById(containerId);
        this.phantom = document.getElementById('grid-phantom');
        this.content = document.getElementById('grid-content');
        this.headerContent = document.getElementById('grid-header-content');
        this.rawData = rawData;
        
        // 원본 정렬 순서 복원을 위한 복사본 저장
        this.originalRawData = [...rawData];

        this.rowHeight = options.rowHeight || 40;
        this.container.style.setProperty('--row-height', `${this.rowHeight}px`);

        this.shadowTable = this.buildShadowTable(rawData, columns);
        this.columns = columns;

        this.colWidths = columns.map(c => c.width || 120);
        this.colOffsets = [];
        this.buildColumnOffsets();

        this.vBuffer = 5;
        this.hBuffer = 200;
        
        this.lastScrollTop = -1;
        this.lastScrollLeft = -1;
        this.lastScrollTime = performance.now();
        this.isTicking = false;
        
        this.renderedVRange = { start: -1, end: -1 };
        this.renderedHRange = { start: -1, end: -1 };

        this.editingCell = null;

        // 정렬 상태 관리 ({ colKey: string, direction: 'asc' | 'desc' | null })
        this.sortState = { colKey: null, direction: null };

        this.rowPool = new Map();
        this.visibleRowsCount = Math.ceil(this.container.clientHeight / this.rowHeight) + (this.vBuffer * 2);
        this.visibleColsCount = 0; 
        this.headerCellPool = new Map();

        this.initDOMPool();
        this.initLayout();
        this.bindEvents();
        this.render(true);
    }

    buildShadowTable(rawData, columns) {
        return rawData.map((doc, rowIndex) => {
            const shadowRow = { _raw: doc, _rowKey: rowIndex };
            for (const col of columns) {
                const rawVal = this.getValueByPath(doc, col.path);
                const type = this.detectType(rawVal);
                shadowRow[col.key] = {
                    displayStr: this.formatDisplayString(rawVal, type),
                    type: type,
                    raw: rawVal
                };
            }
            return shadowRow;
        });
    }

    getValueByPath(obj, path) {
        if (!path) return undefined;
        return path.split('.').reduce((acc, key) => (acc && acc[key] !== undefined) ? acc[key] : undefined, obj);
    }

    setValueByPath(obj, path, value) {
        if (!path) return;
        const keys = path.split('.');
        let current = obj;
        for (let i = 0; i < keys.length - 1; i++) {
            if (!current[keys[i]]) current[keys[i]] = {};
            current = current[keys[i]];
        }
        current[keys[keys.length - 1]] = value;
    }

    detectType(val) {
        if (val === null || val === undefined) return 'null';
        if (typeof val === 'number') return 'number';
        if (typeof val === 'string') {
            if (/^[0-9a-fA-F]{24}$/.test(val)) return 'objectId';
            return 'string';
        }
        if (typeof val === 'object') return 'object';
        return typeof val;
    }

    formatDisplayString(val, type) {
        if (val === null || val === undefined) return '';
        if (type === 'object') return JSON.stringify(val).slice(0, 50);
        const str = String(val);
        return str.length > 100 ? str.slice(0, 100) + '...' : str;
    }

    buildColumnOffsets() {
        this.colOffsets = new Array(this.colWidths.length);
        let acc = 0;
        for (let i = 0; i < this.colWidths.length; i++) {
            this.colOffsets[i] = acc;
            acc += this.colWidths[i];
        }
        this.totalWidth = acc;
    }

    binarySearchColumn(x) {
        let low = 0;
        let high = this.colOffsets.length - 1;
        while (low <= high) {
            const mid = Math.floor((low + high) / 2);
            const offset = this.colOffsets[mid];
            const width = this.colWidths[mid];
            
            if (x >= offset && x < offset + width) {
                return mid;
            } else if (x < offset) {
                high = mid - 1;
            } else {
                low = mid + 1;
            }
        }
        return Math.max(0, Math.min(low, this.colOffsets.length - 1));
    }

    initDOMPool() {
        for (let i = 0; i < this.visibleRowsCount; i++) {
            const rowEl = document.createElement('div');
            rowEl.className = 'grid-row';
            this.rowPool.set(i, {
                element: rowEl,
                cells: new Map(),
                activeRowIndex: -1
            });
        }
    }

    initLayout() {
        this.phantom.style.height = `${this.shadowTable.length * this.rowHeight}px`;
        this.phantom.style.width = `${this.totalWidth}px`;
    }

    bindEvents() {
        this.container.addEventListener('scroll', () => {
            if (!this.isTicking) {
                requestAnimationFrame((timestamp) => {
                    this.onScroll(timestamp);
                    this.isTicking = false;
                });
                this.isTicking = true;
            }
        }, { passive: true });

        this.container.addEventListener('mouseover', (e) => {
            const cell = e.target.closest('.grid-cell');
            if (cell && cell.dataset.raw && !cell.classList.contains('editing')) {
                cell.title = cell.dataset.raw;
            }
        }, { passive: true });

        this.container.addEventListener('dblclick', (e) => {
            const cell = e.target.closest('.grid-cell');
            if (!cell || !cell.dataset.key) return;

            const rowIndex = parseInt(cell.dataset.rowIndex, 10);
            const colKey = cell.dataset.key;
            const colDef = this.columns.find(c => c.key === colKey);

            if (colDef && colDef.editable) {
                this.startEditing(cell, rowIndex, colDef);
            }
        });

        // 헤더 클릭 시 정렬 이벤트
        this.headerContent.addEventListener('click', (e) => {
            const headerCell = e.target.closest('.grid-header-cell');
            if (!headerCell || !headerCell.dataset.key) return;

            const colKey = headerCell.dataset.key;
            const colDef = this.columns.find(c => c.key === colKey);

            if (colDef && colDef.sortable) {
                this.handleSort(colKey);
            }
        });
    }

    // 정렬 로직 처리
    handleSort(colKey) {
        if (this.sortState.colKey === colKey) {
            if (this.sortState.direction === 'asc') {
                this.sortState.direction = 'desc';
            } else if (this.sortState.direction === 'desc') {
                this.sortState.colKey = null;
                this.sortState.direction = null;
            }
        } else {
            this.sortState.colKey = colKey;
            this.sortState.direction = 'asc';
        }

        const colDef = this.columns.find(c => c.key === colKey);

        if (!this.sortState.direction) {
            this.rawData = [...this.originalRawData];
        } else {
            const dirMultiplier = this.sortState.direction === 'asc' ? 1 : -1;
            this.rawData.sort((a, b) => {
                const valA = this.getValueByPath(a, colDef.path);
                const valB = this.getValueByPath(b, colDef.path);

                if (valA === valB) return 0;
                if (valA === undefined || valA === null) return 1;
                if (valB === undefined || valB === null) return -1;

                if (typeof valA === 'string' && typeof valB === 'string') {
                    return valA.localeCompare(valB) * dirMultiplier;
                }
                return (valA > valB ? 1 : -1) * dirMultiplier;
            });
        }

        this.shadowTable = this.buildShadowTable(this.rawData, this.columns);
        this.render(true);
    }

    startEditing(cellEl, rowIndex, colDef) {
        if (this.editingCell) {
            this.stopEditing(true);
        }

        const shadowCell = this.shadowTable[rowIndex][colDef.key];
        const currentVal = shadowCell.raw;

        this.editingCell = { rowIndex, colDef, cellEl };

        cellEl.classList.add('editing');
        cellEl.textContent = '';

        const input = document.createElement('input');
        input.type = shadowCell.type === 'number' ? 'number' : 'text';
        input.className = 'grid-cell-input';
        input.value = currentVal !== undefined && currentVal !== null ? currentVal : '';

        const onCommit = () => {
            this.saveEdit(rowIndex, colDef, input.value);
            this.stopEditing(false);
        };

        input.addEventListener('blur', onCommit);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                input.blur();
            } else if (e.key === 'Escape') {
                this.stopEditing(false);
            }
        });

        cellEl.appendChild(input);
        input.focus();
        input.select();
    }

    saveEdit(rowIndex, colDef, newValue) {
        let parsedVal = newValue;
        if (colDef.type === 'number' || typeof this.shadowTable[rowIndex][colDef.key].raw === 'number') {
            parsedVal = newValue === '' ? null : Number(newValue);
        }

        this.setValueByPath(this.rawData[rowIndex], colDef.path, parsedVal);

        const type = this.detectType(parsedVal);
        this.shadowTable[rowIndex][colDef.key] = {
            displayStr: this.formatDisplayString(parsedVal, type),
            type: type,
            raw: parsedVal
        };
    }

    stopEditing(forceRender = false) {
        if (!this.editingCell) return;
        const { rowIndex, cellEl } = this.editingCell;
        this.editingCell = null;

        if (cellEl && cellEl.parentNode) {
            cellEl.classList.remove('editing');
        }
        this.render(true);
    }

    onScroll(timestamp) {
        if (this.editingCell) {
            this.stopEditing(true);
        }

        const scrollTop = this.container.scrollTop;
        const scrollLeft = this.container.scrollLeft;

        const dt = Math.max(1, timestamp - this.lastScrollTime);
        const dy = Math.abs(scrollTop - this.lastScrollTop);
        const velocity = dy / dt;
        
        this.lastScrollTime = timestamp;
        this.lastScrollTop = scrollTop;
        this.lastScrollLeft = scrollLeft;

        if (velocity > 10) {
            return; 
        }

        this.render(false);
    }

    render(force) {
        const scrollTop = this.container.scrollTop;
        const scrollLeft = this.container.scrollLeft;
        const viewportHeight = this.container.clientHeight;
        const viewportWidth = this.container.clientWidth;

        let startRow = Math.max(0, Math.floor(scrollTop / this.rowHeight) - this.vBuffer);
        let endRow = Math.min(this.shadowTable.length - 1, Math.ceil((scrollTop + viewportHeight) / this.rowHeight) + this.vBuffer);

        let startCol = this.binarySearchColumn(Math.max(0, scrollLeft - this.hBuffer));
        let endCol = this.binarySearchColumn(Math.min(this.totalWidth, scrollLeft + viewportWidth + this.hBuffer));

        if (!force && 
            startRow >= this.renderedVRange.start && endRow <= this.renderedVRange.end &&
            startCol >= this.renderedHRange.start && endCol <= this.renderedHRange.end) {
            return;
        }

        this.renderedVRange = { start: startRow, end: endRow };
        this.renderedHRange = { start: startCol, end: endCol };

        this.content.style.transform = `translate3d(${this.colOffsets[startCol]}px, ${startRow * this.rowHeight}px, 0)`;
        this.headerContent.style.transform = `translate3d(${this.colOffsets[startCol] - scrollLeft}px, 0, 0)`;

        this.renderHeaderCells(startCol, endCol);

        const totalRowsToRender = endRow - startRow + 1;
        
        for (let slot = 0; slot < this.visibleRowsCount; slot++) {
            const poolItem = this.rowPool.get(slot);
            const rowEl = poolItem.element;

            if (slot < totalRowsToRender) {
                const targetRowIndex = startRow + slot;
                const rowData = this.shadowTable[targetRowIndex];

                if (poolItem.activeRowIndex !== targetRowIndex || force) {
                    poolItem.activeRowIndex = targetRowIndex;
                    rowEl.style.transform = `translate3d(0, ${slot * this.rowHeight}px, 0)`;
                    
                    if (!rowEl.parentNode) {
                        this.content.appendChild(rowEl);
                    }

                    this.renderCells(poolItem, rowData, targetRowIndex, startCol, endCol);
                }
            } else {
                poolItem.activeRowIndex = -1;
                if (rowEl.parentNode) {
                    rowEl.parentNode.removeChild(rowEl);
                }
            }
        }
    }

    renderHeaderCells(startCol, endCol) {
        const activeCellKeys = new Set();

        for (let colIdx = startCol; colIdx <= endCol; colIdx++) {
            const col = this.columns[colIdx];
            const cellKey = col.key;
            activeCellKeys.add(cellKey);

            let cellEl = this.headerCellPool.get(cellKey);
            if (!cellEl) {
                cellEl = document.createElement('div');
                cellEl.className = `grid-header-cell${col.sortable ? ' sortable' : ''}`;
                cellEl.dataset.key = cellKey;
                this.headerCellPool.set(cellKey, cellEl);
                this.headerContent.appendChild(cellEl);
            }

            const relativeLeft = this.colOffsets[colIdx] - this.colOffsets[startCol];
            cellEl.style.transform = `translate3d(${relativeLeft}px, 0, 0)`;
            cellEl.style.width = `${this.colWidths[colIdx]}px`;

            let labelText = col.label || col.key;
            if (this.sortState.colKey === cellKey) {
                labelText += this.sortState.direction === 'asc' ? ' ▲' : ' ▼';
            }
            cellEl.textContent = labelText;
        }

        for (const [key, cellEl] of this.headerCellPool.entries()) {
            if (!activeCellKeys.has(key)) {
                if (cellEl.parentNode) {
                    cellEl.parentNode.removeChild(cellEl);
                }
                this.headerCellPool.delete(key);
            }
        }
    }

    renderCells(poolItem, rowData, rowIndex, startCol, endCol) {
        const rowEl = poolItem.element;
        const activeCellKeys = new Set();

        for (let colIdx = startCol; colIdx <= endCol; colIdx++) {
            const col = this.columns[colIdx];
            const cellKey = col.key;
            activeCellKeys.add(cellKey);

            let cellEl = poolItem.cells.get(cellKey);
            
            if (!cellEl) {
                cellEl = document.createElement('div');
                poolItem.cells.set(cellKey, cellEl);
                rowEl.appendChild(cellEl);
            }

            const cellData = rowData[cellKey];
            const relativeLeft = this.colOffsets[colIdx] - this.colOffsets[startCol];

            if (!this.editingCell || this.editingCell.rowIndex !== rowIndex || this.editingCell.colDef.key !== cellKey) {
                cellEl.className = `grid-cell has-icon type-${cellData.type}${col.editable ? ' editable' : ''}`;
                cellEl.style.transform = `translate3d(${relativeLeft}px, 0, 0)`;
                cellEl.style.width = `${this.colWidths[colIdx]}px`;
                cellEl.textContent = cellData.displayStr;
                cellEl.dataset.raw = String(cellData.raw);
                cellEl.dataset.key = cellKey;
                cellEl.dataset.rowIndex = rowIndex;
            }
        }

        for (const [key, cellEl] of poolItem.cells.entries()) {
            if (!activeCellKeys.has(key)) {
                if (cellEl.parentNode) {
                    cellEl.parentNode.removeChild(cellEl);
                }
                poolItem.cells.delete(key);
            }
        }
    }
}

// 컬럼 옵션에 sortable: true 지정
const sampleColumns = [
    { key: 'id', path: '_id', width: 200, label: 'ID', editable: false, sortable: false },
    { key: 'name', path: 'profile.name', width: 150, label: 'Name', editable: true, sortable: true },
    { key: 'age', path: 'profile.age', width: 100, label: 'Age', editable: true, sortable: true }
];

const sampleData = Array.from({ length: 100000 }, (_, i) => ({
    _id: `${(i + 1).toString(16).padStart(24, '0')}`,
    profile: {
        name: `User-${i + 1}`,
        age: 20 + (i % 40)
    }
}));

new HighPerformanceGrid('grid-container', sampleData, sampleColumns, { rowHeight: 40 });
</script>
  </body>
</html>
