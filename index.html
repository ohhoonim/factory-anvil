<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quickstart-lit-library</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "lit": "https://esm.run/lit",
          "lit/directives/repeat.js": "https://esm.run/lit/directives/repeat.js"
        }
      }
    </script>
    <script src="dist/bizui-library-index.es.js" type="module"></script>
  </head>
  <body>

    <biz-application-shell
      variant="default"
    >
      <div slot="header-slot" style="padding: 1rem; font-weight: bold">
        Header Content
      </div>
      <div slot="sidebar-slot" style="padding: 1rem; color: #fff">
        <nav aria-label="Main Navigation">
          <ul>
            <li><a href="#link1" style="color: #fff">Menu Item 1</a></li>
            <li><a href="#link2" style="color: #fff">Menu Item 2</a></li>
          </ul>
        </nav>
        <button id="sidebarCollapsedButton">toggle</button>
      </div>
      <div>
        <h1>Main Content Area</h1>
        <p>This is the main content of the application shell.</p>
      </div>
      <div slot="footer-slot" style="padding: 1rem; text-align: center">
        Footer Content
      </div>
    </biz-application-shell>
    <script>
      let button = document.querySelector("#sidebarCollapsedButton");
      button.addEventListener("click", e => {
        let shell = document.querySelector("biz-application-shell");
        shell.sidebarCollapsed = !shell.sidebarCollapsed;
      });

    </script>
  </body>
</html>
